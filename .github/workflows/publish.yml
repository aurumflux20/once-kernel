name: Publish to PyPI

# Trusted Publishing (OIDC): PyPI accepts this workflow's identity directly.
# No API tokens exist anywhere in this pipeline -- nothing to paste, leak,
# or rotate. Trigger: publishing a GitHub release, or the manual button.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
