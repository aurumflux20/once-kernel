name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (py${{ matrix.python }}) vs real Postgres
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: once_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ONCE_TEST_PG_DSN: postgresql://postgres:postgres@localhost:5432/once_test
      # A silent PG skip must fail CI, never report green untested.
      ONCE_TEST_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,mcp]"
      - name: Test (both backends, junitxml verdict)
        run: |
          python -m pytest tests/ -q --junitxml=junit.xml
      - name: Assert postgres params actually ran
        run: |
          python - << 'EOF'
          import xml.etree.ElementTree as ET
          s = ET.parse('junit.xml').getroot()[0]
          pg = sum(1 for tc in s.iter('testcase') if '[postgres]' in tc.get('name',''))
          skipped = int(s.get('skipped') or 0)
          assert pg >= 13, f"only {pg} postgres-param tests ran"
          assert skipped == 0, f"{skipped} tests skipped in CI"
          print(f"OK: {s.get('tests')} tests, {pg} against real Postgres, 0 skipped")
          EOF

  storm-demo:
    name: storm demo must elect exactly one
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .
      - name: Run the 1000-attempt storm
        run: |
          python -m once.demo | tee storm.txt
          grep -q "✅ ONE execution" storm.txt
