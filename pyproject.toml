[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "once-kernel"
version = "0.1.1"
description = "Enterprise idempotency kernel — side effects under retries run once."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{ name = "AurumFlux" }]
keywords = ["idempotency", "exactly-once", "retries", "webhooks", "payments", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Distributed Computing",
]
dependencies = [
  "rfc8785>=0.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
mcp = ["mcp>=1.0"]
async = []

[project.scripts]
once-mcp = "once.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/once"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
